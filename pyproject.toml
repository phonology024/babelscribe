[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babelscribe"
version = "0.3.2"
description = "Transcribe any audio/video in 99 languages on any GPU (AMD, NVIDIA, Intel via Vulkan; NVIDIA via CUDA; Apple via Metal) or CPU — whisper.cpp with batteries included."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["imageio-ffmpeg>=0.5", "mcp>=2.3,<3; python_version>='3.10'", "anyio>=4; python_version>='3.10'"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Thai",
    "Natural Language :: English",
]
keywords = ["whisper", "speech-to-text", "transcription", "subtitles", "vulkan", "amd", "gpu", "thai", "mcp", "mcp-server", "claude", "codex", "srt", "speech-recognition", "offline", "radeon", "intel-arc", "openai-whisper"]

[project.urls]
Homepage = "https://github.com/phonology024/babelscribe"
Documentation = "https://phonology024.github.io/babelscribe/"
Repository = "https://github.com/phonology024/babelscribe"
Issues = "https://github.com/phonology024/babelscribe/issues"

[project.optional-dependencies]
finetune = ["torch", "transformers", "huggingface_hub", "numpy"]
thai = ["pythainlp"]
mcp = ["mcp>=2.3,<3; python_version>='3.10'", "anyio>=4"]

[project.scripts]
babelscribe = "babelscribe.cli:main"
babelscribe-mcp = "babelscribe.mcp_server:main"

[tool.setuptools]
packages = ["babelscribe"]
