[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babelscribe"
version = "0.3.0"
description = "Transcribe any audio/video in 99 languages on any GPU (AMD, NVIDIA, Intel via Vulkan; NVIDIA via CUDA; Apple via Metal) or CPU — whisper.cpp with batteries included."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["imageio-ffmpeg>=0.5"]
keywords = ["whisper", "speech-to-text", "transcription", "subtitles", "vulkan", "amd", "gpu", "thai", "mcp", "claude", "codex"]

[project.urls]
Homepage = "https://github.com/phonology024/babelscribe"
Issues = "https://github.com/phonology024/babelscribe/issues"

[project.optional-dependencies]
finetune = ["torch", "transformers", "huggingface_hub", "numpy"]
thai = ["pythainlp"]
mcp = ["mcp>=2.3,<3; python_version>='3.10'", "anyio>=4"]

[project.scripts]
babelscribe = "babelscribe.cli:main"
babelscribe-mcp = "babelscribe.mcp_server:main"

[tool.setuptools]
packages = ["babelscribe"]
