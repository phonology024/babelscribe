# Prebuilt whisper.cpp `whisper-cli` for every OS/GPU family, attached to a GitHub release.
# babelscribe downloads the matching asset on first run (see babelscribe/backend.py:asset_name).
#   windows-x64-vulkan  AMD / NVIDIA / Intel GPUs on Windows (Vulkan also drives NVIDIA cards)
#   linux-x64-vulkan    AMD / NVIDIA / Intel GPUs on Linux
#   linux-x64-cuda      NVIDIA (CUDA) on Linux
#   macos-arm64-metal   Apple Silicon
#   *-cpu               any machine without a usable GPU
name: build-binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      whisper_ref: { description: "whisper.cpp tag/branch", default: "v1.9.4" }

env:
  WHISPER_REF: ${{ github.event.inputs.whisper_ref || 'v1.9.4' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64-vulkan, cmake: "-DGGML_VULKAN=ON" }
          - { os: windows-latest, name: windows-x64-cpu,    cmake: "" }
          - { os: ubuntu-22.04,   name: linux-x64-vulkan,   cmake: "-DGGML_VULKAN=ON" }
          - { os: ubuntu-22.04,   name: linux-x64-cuda,     cmake: "-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES='61;70;75;80;86;89;90'", container: "nvidia/cuda:12.6.3-devel-ubuntu22.04" }
          - { os: ubuntu-22.04,   name: linux-x64-cpu,      cmake: "" }
          - { os: macos-14,       name: macos-arm64-metal,  cmake: "-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Container tools
        if: matrix.container
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git cmake build-essential zip p7zip-full >/dev/null

      - uses: actions/checkout@v4
        with: { repository: ggml-org/whisper.cpp, ref: "${{ env.WHISPER_REF }}", path: whisper.cpp }

      - name: Vulkan SDK
        if: contains(matrix.name, 'vulkan')
        uses: jakoch/install-vulkan-sdk-action@v1
        with: { install_runtime: true, cache: true, stripdown: true }

      - name: Configure + build
        shell: bash
        run: |
          # x64: never GGML_NATIVE — it compiles for the CI machine's CPU (AVX-512) and the binary dies with
          # "illegal instruction" on most user PCs. AVX2 baseline runs on virtually every x64 CPU since ~2015.
          PORTABLE=""
          case "${{ matrix.name }}" in *x64*) PORTABLE="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON";; esac
          cmake -S whisper.cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF $PORTABLE ${{ matrix.cmake }}
          cmake --build build --config Release -j 4 --target whisper-cli whisper-quantize

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          find build -type f \( -name 'whisper-cli' -o -name 'whisper-cli.exe' -o -name 'whisper-quantize' -o -name 'whisper-quantize.exe' -o -name '*.dll' \) -exec cp {} pkg/ \;
          cp whisper.cpp/LICENSE pkg/LICENSE-whisper.cpp
          cd pkg && 7z a ../whisper-cli-${{ matrix.name }}.zip . >/dev/null 2>&1 || zip -r ../whisper-cli-${{ matrix.name }}.zip .

      - uses: actions/upload-artifact@v4
        with: { name: "whisper-cli-${{ matrix.name }}", path: "whisper-cli-${{ matrix.name }}.zip" }

  release:
    needs: build
    # publish whatever built: one failing flavour must not block the others — but never a cancelled run
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Claude Desktop extension (.mcpb)
        run: npx -y @anthropic-ai/mcpb pack mcpb dist/babelscribe.mcpb
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*.zip\ndist/babelscribe.mcpb" }
