# Build the Docker image (docker/Dockerfile, CPU, linux/amd64), check that it runs, and on a version tag push it
# to ghcr.io/<owner>/babelscribe:<version> and :latest. Pull requests that touch the image only build and test it.
name: docker
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["docker/**", ".dockerignore", ".github/workflows/docker.yml", "pyproject.toml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t babelscribe -f docker/Dockerfile .

      - name: The image is the version in this checkout
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          got=$(docker run --rm babelscribe --version | awk '{print $NF}')
          echo "pyproject $want, image $got"
          test "$want" = "$got"

      - name: Transcribe a real file (tiny model, CPU)
        run: |
          mkdir media && chmod 777 media
          curl -sL -o media/jfk.wav https://github.com/ggml-org/whisper.cpp/raw/v1.9.4/samples/jfk.wav
          docker run --rm -v "$PWD/media:/media" babelscribe jfk.wav -m tiny -l en -f srt
          cat media/jfk.srt
          grep -qi "country" media/jfk.srt

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag babelscribe "$image:$version"
          docker tag babelscribe "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
