# The hybrid (--accurate Thai / Hindi) benchmark, before and after a change to the alignment, on the same model outputs:
# 50 Google FLEURS test clips per language (CC BY 4.0). The models run once, on the CPU; both alignment versions then
# merge the saved outputs (bench/hybrid_bench.py). Fails when any error count gets worse. Heavy: run by hand from the
# Actions tab, or push a branch to hybrid-bench/<anything>. "before" is babelscribe/align.py of the base ref.
name: hybrid-bench
on:
  workflow_dispatch:
    inputs:
      before: { description: "git ref whose babelscribe/align.py is the 'before'", default: "origin/main" }
  push:
    branches: ["hybrid-bench/**"]

jobs:
  collect:
    name: ${{ matrix.set.config }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        set:
          - { config: th_th, model: thai-pathumma }
          - { config: hi_in, model: hindi-vasista }
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BABELSCRIBE_HOME: ${{ github.workspace }}/.babelscribe-bench
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk space (this runner is thrown away)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[finetune]"
      - run: python bench/fleurs.py fetch clips --n 50 --langs ${{ matrix.set.config }}
      - name: Both models on this shard's clips
        run: >-
          python bench/hybrid_bench.py collect clips/${{ matrix.set.config }} ${{ matrix.set.model }}
          outputs-${{ matrix.set.config }}-${{ matrix.shard }}.json --shard ${{ matrix.shard }}/5 --flavor cpu
      - uses: actions/upload-artifact@v4
        with:      # text and timing only: converted weights are never uploaded
          name: outputs-${{ matrix.set.config }}-${{ matrix.shard }}
          path: outputs-*.json

  # The Thai TEDx talk of docs/benchmarks.md (speech with human captions), scored here. Nothing of it is uploaded or
  # printed: only the numbers. It is fetched from YouTube, which may refuse a CI machine; then only this job fails.
  ted-thai:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 300
    env:
      BABELSCRIBE_HOME: ${{ github.workspace }}/.babelscribe-bench
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk space (this runner is thrown away)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install yt-dlp jiwer num2words
      - run: python bench/ted_clip.py th_ted th https://youtu.be/48A9SU6_bQ8
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[finetune]"
      - run: python bench/hybrid_bench.py collect th_ted thai-pathumma outputs-th_ted.json --flavor cpu
      - name: Before and after on the talk
        env:
          BEFORE: ${{ github.event.inputs.before || 'origin/main' }}
        run: |
          git show "$BEFORE:babelscribe/align.py" > align_before.py
          python bench/hybrid_bench.py score align_before.py outputs-th_ted.json --report "$GITHUB_STEP_SUMMARY"

  score:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . jiwer num2words
      - uses: actions/download-artifact@v4
        with: { path: outputs, pattern: "outputs-*", merge-multiple: true }
      - name: Before and after on the same outputs
        env:
          BEFORE: ${{ github.event.inputs.before || 'origin/main' }}
        run: |
          git show "$BEFORE:babelscribe/align.py" > align_before.py
          python bench/hybrid_bench.py score align_before.py outputs/*.json --report "$GITHUB_STEP_SUMMARY"
