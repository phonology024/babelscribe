[package]
name = "babelscribe-desktop"
version = "0.1.0"
description = "babelscribe desktop app: subtitles from a video or audio file, on this computer"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "~2.7.6", features = [] }

[dependencies]
# ~ keeps the minor version: the tauri CLI wants tauri and @tauri-apps/api (package.json) on the same 2.x.
tauri = { version = "~2.12.7", features = [] }
tauri-plugin-shell = "~2.6.0"
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-opener = "~2.7.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"      # signalling the engine's process group

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
